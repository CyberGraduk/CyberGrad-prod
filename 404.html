<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — CyberGrad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F8FAFC;--text:#0F172A;--text-2:#475569;--border:#E2E8F0;--blue:#1E40AF;--font:'Inter',-apple-system,sans-serif;--radius:8px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.num{font-size:80px;font-weight:800;color:var(--blue);letter-spacing:-4px;line-height:1;margin-bottom:16px}
h1{font-size:24px;font-weight:700;margin-bottom:10px}
p{font-size:15px;color:var(--text-2);margin-bottom:28px;max-width:400px}
.btn{background:var(--blue);color:#fff;padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:700;text-decoration:none;margin:0 6px;display:inline-block}
.btn-outline{background:#fff;color:var(--blue);border:1px solid #BFDBFE;padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;text-decoration:none;margin:0 6px;display:inline-block}
</style>
</head>
<body>
<div class="num">404</div>
<h1>Page not found</h1>
<p>The page you are looking for does not exist or has been moved.</p>
<div>
  <a href="index.html" class="btn">Go to homepage</a>
  <a href="cv-checker.html" class="btn-outline">Check my CV</a>
</div>
</body>
</html>
