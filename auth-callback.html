<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberGrad — Signing you in...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8FAFC;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}
.wrap{text-align:center}
.logo{width:44px;height:44px;background:#1E40AF;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-family:'Inter',sans-serif;font-size:16px;font-weight:800;color:#fff}
.msg{font-size:15px;color:#8896B3}
.spinner{width:20px;height:20px;border:2px solid #131D30;border-top-color:#1E40AF;border-radius:50%;animation:spin .7s linear infinite;margin:16px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">CG</div>
  <div class="msg">Signing you in...</div>
  <div class="spinner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://oglsolxcvchgmjcprrwa.supabase.co',
  'sb_publishable_db574zB3xRVXfKQEMHW2RA_Q7v8RWfE'
);

// Process the token from the hash, then redirect cleanly
async function processAuth() {
  try {
    // Check the type from URL hash
    const hash = window.location.hash;
    const params = new URLSearchParams(hash.replace('#', '?'));
    const type = params.get('type');

    const { data, error } = await sb.auth.getSession();

    if (data?.session) {
      await handleSession(data.session, type);
    } else {
      sb.auth.onAuthStateChange(async (event, session) => {
        if (session) await handleSession(session, type);
      });
      setTimeout(async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) await handleSession(session, type);
        else window.location.replace('https://www.cyber-grad.co.uk/login.html');
      }, 3000);
    }
  } catch(e) {
    window.location.replace('https://www.cyber-grad.co.uk/login.html');
  }
}

async function handleSession(session, type) {
  try {
    // signup confirmation — always go to dashboard directly
    // student row is being inserted by signup.html separately
    if (type === 'signup' || type === 'recovery') {
      window.location.replace('https://www.cyber-grad.co.uk/dashboard.html');
      return;
    }

    // magic link login — check if student row exists
    const { data: student } = await sb
      .from('students')
      .select('email')
      .eq('email', session.user.email)
      .single();

    if (student) {
      window.location.replace('https://www.cyber-grad.co.uk/dashboard.html');
    } else {
      window.location.replace('https://www.cyber-grad.co.uk/signup.html?complete=1');
    }
  } catch(e) {
    // Any error — go to dashboard safely
    window.location.replace('https://www.cyber-grad.co.uk/dashboard.html');
  }
}

processAuth();
</script>
</body>
</html>
